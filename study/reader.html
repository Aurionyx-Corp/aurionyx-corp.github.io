<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Читання книги - Study</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg: #0f1715;
            --bg-panel: #1a2421;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #4CAF50;
            --accent: #81C784;
            --text: #E8F5E9;
            --text-muted: #A5C4B0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* ================= САЙДБАР (Для планшетов и ПК) ================= */
        .sidebar {
            width: 250px; background: var(--bg-panel); border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; transition: transform 0.3s ease;
            z-index: 20;
        }
        .sidebar.hidden { transform: translateX(-100%); position: absolute; height: 100%; }
        
        .sidebar-header {
            padding: 15px; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 14px;
        }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        .thumbnail {
            width: 100%; max-width: 150px; cursor: pointer; border: 2px solid transparent;
            border-radius: 4px; overflow: hidden; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .thumbnail:hover { transform: scale(1.05); }
        .thumbnail.active { border-color: var(--primary); box-shadow: 0 0 15px rgba(76, 175, 80, 0.4); }
        .thumbnail canvas { width: 100%; height: auto; display: block; }
        .thumbnail span { display: block; text-align: center; font-size: 12px; padding: 4px; background: rgba(0,0,0,0.5); color: #fff; }

        /* ================= ОСНОВНАЯ ЗОНА ================= */
        .main-viewer { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

        /* Верхняя панель управления */
        .toolbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; background: var(--glass); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border); z-index: 10;
            transition: transform 0.3s ease;
        }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 15px; }
        
        .back-btn { color: var(--primary); font-weight: bold; text-decoration: none; font-size: 16px; display: flex; align-items: center; gap: 5px; }
        .doc-title { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
        
        .icon-btn {
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
            padding: 6px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); }
        .icon-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .zoom-controls { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 10px; }
        .zoom-controls span { font-size: 13px; font-weight: bold; min-width: 45px; text-align: center; }

        /* Контейнер с PDF */
        .pdf-container {
            flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
            padding: 20px; position: relative;
        }
        
        .canvas-wrapper {
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            background: white; border-radius: 4px; position: relative;
        }

        canvas { display: block; transition: filter 0.3s ease; }
        canvas.inverted { filter: invert(0.9) hue-rotate(180deg); }

        /* Загрузчик */
        .loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 4px solid var(--glass-border); border-top: 4px solid var(--primary);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Нижняя панель (для мобилок) */
        .mobile-controls {
            display: none; justify-content: center; align-items: center; gap: 20px;
            padding: 15px; background: var(--glass); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
        }

        /* ================= АДАПТАЦИЯ (Мобилки) ================= */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            .doc-title { max-width: 50vw; }
            .zoom-controls { display: none; } /* Скрываем зум на мобилках */
            .mobile-controls { display: flex; }
            .pdf-container { padding: 10px; align-items: center; } /* Центрируем по вертикали */
        }
    </style>
</head>
<body>

    <!-- Сайдбар с миниатюрами -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Сторінки</span>
            <button class="icon-btn" style="padding: 2px 8px;" onclick="toggleSidebar()">×</button>
        </div>
        <div class="sidebar-content" id="thumbnailsContainer"></div>
    </aside>

    <!-- Основная зона -->
    <main class="main-viewer">
        <!-- Панель инструментов -->
        <div class="toolbar" id="toolbar">
            <div class="toolbar-left">
                <button class="icon-btn" onclick="toggleSidebar()">☰</button>
                <a href="index.html" class="back-btn">←</a>
                <div class="doc-title" id="bookTitle">Завантаження...</div>
            </div>
            
            <div class="toolbar-right">
                <div class="zoom-controls">
                    <button class="icon-btn" onclick="changeZoom(-0.2)">−</button>
                    <span id="zoomLevel">100%</span>
                    <button class="icon-btn" onclick="changeZoom(0.2)">+</button>
                </div>
                <button class="icon-btn" id="invertBtn" onclick="toggleInvert()">🌙</button>
            </div>
        </div>

        <!-- Окно с PDF -->
        <div class="pdf-container" id="pdfContainer">
            <div class="loader" id="loader"></div>
            <div class="canvas-wrapper" id="canvasWrapper"></div>
        </div>

        <!-- Нижние кнопки (для телефонов) -->
        <div class="mobile-controls">
            <button class="icon-btn" onclick="changePage(-1)">←</button>
            <span id="mobilePageInfo" style="font-size: 14px; font-weight: bold;">1 / 1</span>
            <button class="icon-btn" onclick="changePage(1)">→</button>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pdfPath = urlParams.get('file');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPage = 1;
        let currentScale = 1.0;
        let isInverted = false;
        const storageKey = `pdf_last_page_${pdfPath}`;

        const canvasWrapper = document.getElementById('canvasWrapper');
        const thumbnailsContainer = document.getElementById('thumbnailsContainer');
        const loader = document.getElementById('loader');
        const pdfContainer = document.getElementById('pdfContainer');
        const zoomLevelText = document.getElementById('zoomLevel');
        const mobilePageInfo = document.getElementById('mobilePageInfo');

        if(pdfPath) {
            const fileName = decodeURIComponent(pdfPath.split('/').pop()).replace('.pdf', '').replace(/%20/g, ' ');
            document.getElementById('bookTitle').innerText = fileName;
            loadPDF();
        }

        async function loadPDF() {
            loader.style.display = 'block';
            try {
                const loadingTask = pdfjsLib.getDocument(pdfPath);
                pdfDoc = await loadingTask.promise;
                
                // Восстанавливаем страницу
                const savedPage = localStorage.getItem(storageKey);
                if (savedPage) currentPage = parseInt(savedPage);

                loader.style.display = 'none';
                renderPage(currentPage);
                generateThumbnails(); // Запускаем генерацию миниатюр в фоне
            } catch (error) {
                loader.style.display = 'none';
                canvasWrapper.innerHTML = '<p style="color: #FF5252; padding: 20px;">Помилка завантаження файлу.</p>';
            }
        }

        // Рендер основной страницы
        async function renderPage(num) {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(num);
            
            // HD качество для планшетов и ноутбуков
            const outputScale = window.devicePixelRatio || 1;
            const viewport = page.getViewport({ scale: currentScale });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = Math.floor(viewport.width) + "px";
            canvas.style.height = Math.floor(viewport.height) + "px";

            if (isInverted) canvas.classList.add('inverted');
            
            canvasWrapper.innerHTML = '';
            canvasWrapper.appendChild(canvas);

            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
            const renderContext = { canvasContext: context, transform: transform, viewport: viewport };
            
            await page.render(renderContext).promise;

            localStorage.setItem(storageKey, num);
            mobilePageInfo.innerText = `${num} / ${pdfDoc.numPages}`;
            zoomLevelText.innerText = `${Math.round(currentScale * 100)}%`;
            
            // Подсвечиваем активную миниатюру
            document.querySelectorAll('.thumbnail').forEach((el, index) => {
                el.classList.toggle('active', index + 1 === num);
            });
        }

        // Генерация миниатюр для сайдбара
        async function generateThumbnails() {
            if (window.innerWidth <= 768) return; // Не генерируем на мобилках (для экономии памяти)
            thumbnailsContainer.innerHTML = '';
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 0.3 }); // Маленький размер
                
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                
                const div = document.createElement('div');
                div.className = `thumbnail ${i === currentPage ? 'active' : ''}`;
                div.onclick = () => {
                    currentPage = i;
                    renderPage(currentPage);
                    pdfContainer.scrollTop = 0;
                };
                div.appendChild(canvas);
                
                const span = document.createElement('span');
                span.innerText = i;
                div.appendChild(span);
                
                thumbnailsContainer.appendChild(div);
            }
        }

        // Управление страницами
        function changePage(offset) {
            if (!pdfDoc) return;
            currentPage += offset;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > pdfDoc.numPages) currentPage = pdfDoc.numPages;
            renderPage(currentPage);
            pdfContainer.scrollTop = 0;
        }

        // Управление зумом
        function changeZoom(delta) {
            currentScale += delta;
            if (currentScale < 0.5) currentScale = 0.5;
            if (currentScale > 3.0) currentScale = 3.0;
            renderPage(currentPage);
        }

        // Инверсия цветов (Темная тема для PDF)
        function toggleInvert() {
            isInverted = !isInverted;
            document.getElementById('invertBtn').classList.toggle('active', isInverted);
            const canvas = canvasWrapper.querySelector('canvas');
            if (canvas) canvas.classList.toggle('inverted', isInverted);
        }

        // Боковая панель
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('open'); // Выдвигается поверх на мобилках
            } else {
                sidebar.classList.toggle('hidden'); // Скрывается влево на ПК
            }
        }

        // --- ГОРЯЧИЕ КЛАВИШИ (Для ПК и ноутбуков) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') changePage(1);
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') changePage(-1);
            if (e.key === 'Escape') toggleSidebar(); // Закрыть сайдбар по Esc
        });

        // --- МАСШТАБИРОВАНИЕ КОЛЕСИКОМ МЫШИ (С зажатым Ctrl) ---
        pdfContainer.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                if (e.deltaY < 0) changeZoom(0.1);
                else changeZoom(-0.1);
            }
        }, { passive: false });

        // --- СВАЙПЫ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ ---
        let touchStartX = 0;
        let touchEndX = 0;
        
        pdfContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        pdfContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) changePage(1); // Свайп влево
            if (touchEndX > touchStartX + swipeThreshold) changePage(-1); // Свайп вправо
        }, { passive: true });

    </script>
</body>
</html>
