<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAStudy - БЦПО 64-ОКА</title>
    <style>
        :root {
            --bg: #0f1715;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #4CAF50;
            --accent: #81C784;
            --text: #E8F5E9;
            --text-muted: #A5C4B0;
            --danger: #FF5252;
        }
        
        /* Специальная тема для Дня Независимости (сине-желтая) */
        body.theme-independence {
            --bg: #0a1930;
            --primary: #0057B7;
            --accent: #FFD700;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 215, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); background-image: radial-gradient(circle at 10% 20%, rgba(76, 175, 80, 0.15) 0%, transparent 50%), radial-gradient(circle at 90% 80%, rgba(129, 199, 132, 0.1) 0%, transparent 50%); color: var(--text); min-height: 100vh; display: flex; justify-content: center; transition: background 0.5s; }
        .app-container { width: 100%; max-width: 430px; padding: 20px 20px 90px 20px; position: relative; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 10px; }
        .header-title h1 { font-size: 24px; font-weight: 800; }
        .header-title p { font-size: 13px; color: var(--text-muted); }
        .stamp-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; mix-blend-mode: screen; filter: contrast(1.2); }

        /* Фикс для пятницы */
        .days-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; padding-right: 15px; scrollbar-width: thin; }
        .days-nav::-webkit-scrollbar { height: 4px; }
        .days-nav::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        .day-btn { padding: 8px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .substitution-alert { background: rgba(255, 82, 82, 0.15); border: 1px solid rgba(255, 82, 82, 0.3); backdrop-filter: blur(20px); border-radius: 16px; padding: 16px; margin-bottom: 20px; display: none; animation: pulse 2s infinite alternate; }
        .substitution-alert.show { display: flex; gap: 12px; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.2); } 100% { box-shadow: 0 0 0 10px rgba(255, 82, 82, 0); } }
        .sub-text h3 { color: var(--danger); font-size: 15px; margin-bottom: 4px; }
        .sub-text p { font-size: 13px; color: var(--text); line-height: 1.4; }

        /* Карточка с эффектом наведения */
        .class-card { 
            background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); 
            border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; gap: 16px; 
            position: relative; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s; 
            cursor: pointer; overflow: hidden;
        }
        .class-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .class-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); border-radius: 4px 0 0 4px; }
        .class-card.is-sub { background: rgba(255, 82, 82, 0.05); border-color: rgba(255, 82, 82, 0.2); }
        .class-card.is-sub::before { background: var(--danger); }
        
        .time-col { display: flex; flex-direction: column; min-width: 75px; }
        .time-start { font-weight: bold; font-size: 14px; }
        .lesson-num { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        
        .info-col { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .info-col h3 { font-size: 16px; margin-bottom: 4px; }
        .room-badge { display: inline-block; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 8px; font-size: 11px; margin-top: 4px; font-weight: 600; align-self: flex-start; }
        .sub-badge { color: var(--danger); font-size: 12px; font-weight: bold; margin-top: 4px; display: block; }
        .old-info { text-decoration: line-through; opacity: 0.5; font-size: 12px; margin-top: 2px; display: block; }

        /* Скрытый блок с таймером, который выезжает при наведении */
        .time-info {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-top: 0;
        }
        .class-card:hover .time-info {
            max-height: 30px;
            opacity: 1;
            margin-top: 8px;
        }

        .bell-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .bell-toggle button { flex: 1; padding: 10px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); cursor: pointer; font-weight: 600; }
        .bell-toggle button.active { background: var(--primary); border-color: var(--primary); color: white; }
        
        .bell-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 8px; }
        .bell-num { font-weight: bold; color: var(--accent); width: 30px; }
        .bell-time { flex: 1; font-size: 15px; }
        .bell-break { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 390px; background: rgba(20, 30, 25, 0.8); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 24px; display: flex; justify-content: space-around; padding: 10px 5px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; padding: 8px 16px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--text); background: rgba(76, 175, 80, 0.2); }
        .nav-icon { font-size: 20px; }
        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .about-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; text-align: center; }
        .btn-tg { background: #229ED9; color: white; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; display: inline-block; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">
            <h1>Розклад</h1>
            <p>64-ОКА • БЦПО (Стебник)</p>
        </div>
        <img src="stamp.png" alt="Алкаши" class="stamp-img">
    </header>

    <div id="tab-schedule" class="screen active">
        <div class="days-nav" id="daysNav"></div>
        <div class="substitution-alert" id="subAlert">
            <div style="font-size: 24px;">⚠️</div>
            <div class="sub-text">
                <h3>Увага! Заміни</h3>
                <p id="subAlertText"></p>
            </div>
        </div>
        <div id="scheduleList"></div>
    </div>

    <div id="tab-bells" class="screen">
        <h2 style="margin-bottom: 15px;">Розклад дзвінків</h2>
        <div class="bell-toggle">
            <button id="btnRegular" class="active" onclick="switchBells('regular')">Звичайні</button>
            <button id="btnShort" onclick="switchBells('short')">Скорочені</button>
        </div>
        <div id="bellsList"></div>
    </div>

    <div id="tab-settings" class="screen">
        <div class="about-card">
            <h2>LAStudy</h2>
            <p>Додаток для групи <b>64-ОКА</b>.<br>БЦПО (філія м. Стебник).</p>
            <p style="font-size: 12px; margin-top: 20px;">Розроблено командою <b>Aurionyx</b><br>на замовлення <b>@UwU_OwO3</b></p>
            <a href="https://t.me/+uTqAdMylt85jYmIy" class="btn-tg" target="_blank">🚀 Перейти в "Алкаши"</a>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('schedule', this)">
            <span class="nav-icon">📅</span><span>Розклад</span>
        </div>
        <div class="nav-item" onclick="switchTab('bells', this)">
            <span class="nav-icon">🔔</span><span>Дзвінки</span>
        </div>
        <div class="nav-item" onclick="switchTab('settings', this)">
            <span class="nav-icon">⚙️</span><span>Налаштування</span>
        </div>
    </div>
</div>

<script src="data.js"></script>

<script>
    const daysOfWeek = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця"];
    let currentDay = "Понеділок";

    document.addEventListener('DOMContentLoaded', () => {
        checkHoliday();
        
        const today = new Date().getDay(); 
        if (today >= 1 && today <= 5) {
            currentDay = daysOfWeek[today - 1];
        }
        renderDaysNav();
        renderSchedule();
        renderBells(regularBells); 

        // Обновляем время на карточках каждую минуту
        setInterval(updateCardTimes, 60000); 
    });

    // Проверка на праздник
    function checkHoliday() {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateKey = `${month}-${day}`;

        if (holidays && holidays[dateKey]) {
            // Если сегодня праздник, включаем особую тему
            if (dateKey === "08-24") {
                document.body.classList.add('theme-independence');
            }
            // Можно добавить вывод сообщения "Зі святом!"
        }
    }

    function renderDaysNav() {
        const nav = document.getElementById('daysNav');
        nav.innerHTML = '';
        daysOfWeek.forEach(day => {
            const btn = document.createElement('div');
            btn.className = `day-btn ${day === currentDay ? 'active' : ''}`;
            btn.innerText = day;
            btn.onclick = () => {
                currentDay = day;
                renderDaysNav();
                renderSchedule();
            };
            nav.appendChild(btn);
        });
    }

    // Функция для склонения минут
    function getMinutesText(mins) {
        if (mins % 10 === 1 && mins % 100 !== 11) return `${mins} хвилину`;
        if ([2, 3, 4].includes(mins % 10) && ![12, 13, 14].includes(mins % 100)) return `${mins} хвилини`;
        return `${mins} хвилин`;
    }

    // Логика обновления времени
    function updateCardTimes() {
        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();
        const dateStr = now.toISOString().split('T')[0];

        document.querySelectorAll('.class-card').forEach(card => {
            const timeInfo = card.querySelector('.time-info');
            if (!timeInfo) return;

            // Получаем время из data-атрибутов (добавим их при рендере)
            const startMins = parseInt(card.dataset.start);
            const endMins = parseInt(card.dataset.end);
            
            // Показываем таймер только для сегодняшнего дня
            if (currentDay === daysOfWeek[now.getDay() - 1]) {
                if (currentMins >= startMins && currentMins < endMins) {
                    timeInfo.innerText = "🟢 Зараз триває";
                    timeInfo.style.color = "var(--primary)";
                } else if (currentMins < startMins) {
                    const diff = startMins - currentMins;
                    timeInfo.innerText = `⏳ До початку ${getMinutesText(diff)}`;
                    timeInfo.style.color = "var(--accent)";
                } else {
                    timeInfo.innerText = "✅ Вже закінчилась";
                    timeInfo.style.color = "var(--text-muted)";
                }
            } else {
                timeInfo.innerText = ""; // Не показываем на другие дни
            }
        });
    }

    function renderSchedule() {
        const list = document.getElementById('scheduleList');
        const alertBox = document.getElementById('subAlert');
        const alertText = document.getElementById('subAlertText');
        
        list.innerHTML = '';
        alertBox.classList.remove('show');

        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const daySchedule = weeklySchedule[currentDay] || [];
        const todaySubs = substitutions[dateStr];

        if (todaySubs && todaySubs.length > 0) {
            alertBox.classList.add('show');
            alertText.innerText = `На сьогодні є зміни. Перевірте розклад!`;
        }

        if (daySchedule.length === 0) {
            list.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top: 20px;">Пар немає. Відпочиваємо! 🎉</p>';
            return;
        }

        daySchedule.forEach((lesson) => {
            let sub = null;
            if (todaySubs && currentDay === daysOfWeek[now.getDay() - 1]) {
                sub = todaySubs.find(s => s.num === lesson.num);
            }

            // Парсим время в минуты для таймера
            const [startH, startM] = lesson.time.split('-')[0].split(':');
            const [endH, endM] = lesson.time.split('-')[1].split(':');
            const startMins = parseInt(startH) * 60 + parseInt(startM);
            const endMins = parseInt(endH) * 60 + parseInt(endM);

            const card = document.createElement('div');
            card.className = `class-card ${sub ? 'is-sub' : ''}`;
            // Сохраняем время в data-атрибутах карточки
            card.dataset.start = startMins;
            card.dataset.end = endMins;
            
            let html = `
                <div class="time-col">
                    <span class="lesson-num">${lesson.num} пара</span>
                    <span class="time-start">${lesson.time}</span>
                </div>
                <div class="info-col">
            `;

            if (sub) {
                html += `
                    <h3>${sub.subject}</h3>
                    <span class="sub-badge">⚠️ Заміна</span>
                    <span class="old-info">Було: ${lesson.subject}</span>
                `;
            } else {
                html += `
                    <h3>${lesson.subject}</h3>
                    ${lesson.room ? `<span class="room-badge">${lesson.room}</span>` : ''}
                `;
            }

            // Добавляем скрытый блок с таймером
            html += `<div class="time-info"></div>`;
            html += `</div>`;
            
            card.innerHTML = html;
            list.appendChild(card);
        });

        // Сразу вызываем обновление таймеров при отрисовке
        updateCardTimes();
    }

    function renderBells(data) {
        const list = document.getElementById('bellsList');
        list.innerHTML = '';
        data.forEach(bell => {
            const row = document.createElement('div');
            row.className = 'bell-row';
            row.innerHTML = `
                <div class="bell-num">${bell.num}</div>
                <div class="bell-time">${bell.time}</div>
                <div class="bell-break">${bell.break}</div>
            `;
            list.appendChild(row);
        });
    }

    function switchBells(type) {
        document.getElementById('btnRegular').classList.remove('active');
        document.getElementById('btnShort').classList.remove('active');
        
        if (type === 'regular') {
            document.getElementById('btnRegular').classList.add('active');
            renderBells(regularBells);
        } else {
            document.getElementById('btnShort').classList.add('active');
            renderBells(shortBells);
        }
    }

    function switchTab(tabId, navElement) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        navElement.classList.add('active');
    }
</script>
</body>
</html>
