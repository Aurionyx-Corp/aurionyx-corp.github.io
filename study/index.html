<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAStudy - БЦПО 64-ОКА</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="stamp.png">

    <style>
        :root {
            --bg: #0f1715;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #4CAF50;
            --accent: #81C784;
            --text: #E8F5E9;
            --text-muted: #A5C4B0;
            --danger: #FF5252;
        }
        
        body.theme-independence {
            --bg: #0a1930;
            --primary: #0057B7;
            --accent: #FFD700;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 215, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); background-image: radial-gradient(circle at 10% 20%, rgba(76, 175, 80, 0.15) 0%, transparent 50%), radial-gradient(circle at 90% 80%, rgba(129, 199, 132, 0.1) 0%, transparent 50%); color: var(--text); min-height: 100vh; display: flex; justify-content: center; transition: background 0.5s; overflow-x: hidden; }
        
        .app-container { width: 100%; max-width: 430px; padding: 20px 20px 130px 20px; position: relative; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 10px; }
        .header-title h1 { font-size: 24px; font-weight: 800; }
        .header-title p { font-size: 13px; color: var(--text-muted); }
        .stamp-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; mix-blend-mode: screen; filter: contrast(1.2); }

        .days-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; padding-right: 15px; scrollbar-width: thin; }
        .days-nav::-webkit-scrollbar { height: 4px; }
        .days-nav::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        .day-btn { padding: 8px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .schedule-mode-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
        .schedule-mode-toggle button { flex: 1; padding: 8px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .schedule-mode-toggle button.active { background: rgba(255,255,255,0.15); color: var(--text); border-color: var(--text-muted); }

        .substitution-alert { background: rgba(255, 82, 82, 0.15); border: 1px solid rgba(255, 82, 82, 0.3); backdrop-filter: blur(20px); border-radius: 16px; padding: 16px; margin-bottom: 20px; display: none; animation: pulse 2s infinite alternate; align-items: center; gap: 12px; }
        .substitution-alert.show { display: flex; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.2); } 100% { box-shadow: 0 0 0 10px rgba(255, 82, 82, 0); } }
        .sub-text h3 { color: var(--danger); font-size: 15px; margin-bottom: 4px; }
        .sub-text p { font-size: 13px; color: var(--text); line-height: 1.4; }

        .class-card { 
            background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); 
            border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; gap: 16px; 
            position: relative; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s; 
            cursor: pointer; overflow: hidden;
        }
        .class-card:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 10; }
        .class-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); border-radius: 4px 0 0 4px; }
        .class-card.is-sub { background: rgba(255, 82, 82, 0.05); border-color: rgba(255, 82, 82, 0.2); }
        .class-card.is-sub::before { background: var(--danger); }
        
        .time-col { display: flex; flex-direction: column; min-width: 75px; }
        .time-start { font-weight: bold; font-size: 14px; }
        .time-start.short-time { color: var(--accent); }
        .lesson-num { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        
        .info-col { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .info-col h3 { font-size: 16px; margin-bottom: 4px; }
        .room-badge { display: inline-block; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 8px; font-size: 11px; margin-top: 4px; font-weight: 600; align-self: flex-start; }
        
        .sub-badge { color: var(--danger); font-size: 12px; font-weight: bold; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
        .sub-badge svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .old-info { text-decoration: line-through; opacity: 0.5; font-size: 12px; margin-top: 2px; display: block; }
        
        .time-info {
            max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease;
            font-size: 12px; font-weight: 600; margin-top: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .class-card:hover .time-info { max-height: 30px; opacity: 1; margin-top: 8px; }
        .time-info svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .bell-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .bell-toggle button { flex: 1; padding: 10px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); cursor: pointer; font-weight: 600; }
        .bell-toggle button.active { background: var(--primary); border-color: var(--primary); color: white; }
        
        .bell-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 8px; }
        .bell-num { font-weight: bold; color: var(--accent); width: 30px; }
        .bell-time { flex: 1; font-size: 15px; }
        .bell-break { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; }

        .teacher-card { background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .teacher-card h3 { font-size: 16px; margin-bottom: 6px; color: var(--primary); }
        .teacher-card .subjects { font-size: 13px; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
        .teacher-card .room { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--accent); background: rgba(129, 199, 132, 0.1); padding: 4px 10px; border-radius: 8px; }
        .teacher-card .room svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

        .book-card { display: flex; gap: 16px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        .book-cover { width: 80px; height: 110px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 24px; flex-shrink: 0; }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .book-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .book-info h3 { font-size: 15px; margin-bottom: 4px; line-height: 1.3; }
        .book-info p { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .book-actions { display: flex; gap: 8px; }
        .btn-book { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-read { background: var(--primary); color: white; }
        .btn-download { background: rgba(255,255,255,0.1); color: var(--text); }

        .liquid-nav-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 390px; height: 64px;
            background: rgba(20, 30, 25, 0.7);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100; display: flex; justify-content: space-around; align-items: center;
            touch-action: none;
        }

        .nav-blob {
            position: absolute; top: 4px; left: 0;
            width: calc(100% / 5); height: 56px;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.3), rgba(129, 199, 132, 0.2));
            border: 1px solid rgba(129, 199, 132, 0.4);
            border-radius: 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.2), inset 0 0 10px rgba(255,255,255,0.1);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
            pointer-events: none;
        }

        .nav-item {
            position: relative; z-index: 2; flex: 1; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--text-muted); font-size: 9px; cursor: pointer;
            transition: color 0.3s, transform 0.3s;
        }
        .nav-item.active { color: var(--text); transform: scale(1.05); }
        .nav-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s; margin-bottom: 2px; }
        .nav-item.active .nav-icon svg { transform: translateY(-2px); }

        .screen { display: none; } .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .about-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; text-align: center; }
        .btn-tg { background: #229ED9; color: white; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; width: 100%; border: none; cursor: pointer; }
    </style>
</head>
<body>

            <p style="font-size: 12px; margin-top: 20px;">Розроблено командою <b>Aurionyx</b><br>на замовлення <b>@UwU_OwO3</b></p>
            <a href="https://t.me/+uTqAdMylt85jYmIy" class="btn-tg" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                Перейти в "Алкаши"
            </a>

</div>

<div class="liquid-nav-container" id="liquidNav">
    <div class="nav-blob" id="navBlob"></div>
    
    <div class="nav-item active" data-index="0" onclick="switchTab('schedule', this, 0)">
        <span class="nav-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>

            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>

<script src="data.js"></script>

<script>
    const ICONS = {
        warning: `<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
        clock: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,
        play: `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
        check: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
        location: `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`,
        book: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`
    };

    const daysOfWeek = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця"];
    let currentDay = "Понеділок";
    let isShortenedMode = false; 

    document.addEventListener('DOMContentLoaded', () => {
        checkHoliday();
        const today = new Date().getDay(); 
        if (today >= 1 && today <= 5) {
            currentDay = daysOfWeek[today - 1];
        }
        renderDaysNav();
        renderSchedule();
        renderBells(regularBells); 
        renderTeachers();
        renderBooks();
        setInterval(updateCardTimes, 60000); 
        
        setTimeout(() => moveBlob(0), 100);
    });

    function checkHoliday() {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateKey = `${month}-${day}`;
        if (holidays && holidays[dateKey] && dateKey === "08-24") {
            document.body.classList.add('theme-independence');
        }
    }

    function renderDaysNav() {
        const nav = document.getElementById('daysNav');
        nav.innerHTML = '';
        daysOfWeek.forEach(day => {
            const btn = document.createElement('div');
            btn.className = `day-btn ${day === currentDay ? 'active' : ''}`;
            btn.innerText = day;
            btn.onclick = () => {
                currentDay = day;
                renderDaysNav();
                renderSchedule();
            };
            nav.appendChild(btn);
        });
    }

    function setScheduleMode(mode) {
        isShortenedMode = (mode === 'short');
        document.getElementById('btnModeRegular').classList.toggle('active', !isShortenedMode);
        document.getElementById('btnModeShort').classList.toggle('active', isShortenedMode);
        renderSchedule();
    }

    function getMinutesText(mins) {
        if (mins % 10 === 1 && mins % 100 !== 11) return `${mins} хвилину`;
        if ([2, 3, 4].includes(mins % 10) && ![12, 13, 14].includes(mins % 100)) return `${mins} хвилини`;
        return `${mins} хвилин`;
    }

    function updateCardTimes() {
        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();
        document.querySelectorAll('.class-card').forEach(card => {
            const timeInfo = card.querySelector('.time-info');
            if (!timeInfo) return;
            const startMins = parseInt(card.dataset.start);
            const endMins = parseInt(card.dataset.end);
            
            if (currentDay === daysOfWeek[now.getDay() - 1]) {
                if (currentMins >= startMins && currentMins < endMins) {
                    const endTimeStr = card.querySelector('.time-start').innerText.split('-')[1];
                    timeInfo.innerHTML = `${ICONS.play} Зараз триває (до ${endTimeStr})`;
                    timeInfo.style.color = "var(--primary)";
                } else if (currentMins < startMins) {
                    const diff = startMins - currentMins;
                    timeInfo.innerHTML = `${ICONS.clock} До початку ${getMinutesText(diff)}`;
                    timeInfo.style.color = "var(--accent)";
                } else {
                    timeInfo.innerHTML = `${ICONS.check} Вже закінчилась`;
                    timeInfo.style.color = "var(--text-muted)";
                }
            } else {
                timeInfo.innerHTML = ""; 
            }
        });
    }

    function renderSchedule() {
        const list = document.getElementById('scheduleList');
        const alertBox = document.getElementById('subAlert');
        const alertText = document.getElementById('subAlertText');
        
        list.innerHTML = '';
        alertBox.classList.remove('show');

        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const daySchedule = weeklySchedule[currentDay] || [];
        const todaySubs = substitutions[dateStr];

        if (todaySubs && todaySubs.length > 0 && currentDay === daysOfWeek[now.getDay() - 1]) {
            alertBox.classList.add('show');
            alertText.innerText = `На сьогодні є зміни. Перевірте розклад!`;
        }

        if (daySchedule.length === 0) {
            list.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top: 20px;">Пар немає. Відпочиваємо! 🎉</p>';
            return;
        }

        daySchedule.forEach((lesson) => {
            let sub = null;
            if (todaySubs && currentDay === daysOfWeek[now.getDay() - 1]) {
                sub = todaySubs.find(s => s.num === lesson.num);
            }

            let displayTime = lesson.time;
            if (isShortenedMode) {
                const shortBell = shortBells.find(b => b.num === lesson.num);
                if (shortBell) displayTime = shortBell.time.replace(/\s+/g, '');
            }

            const [startH, startM] = displayTime.split('-')[0].split(':');
            const [endH, endM] = displayTime.split('-')[1].split(':');
            const startMins = parseInt(startH) * 60 + parseInt(startM);
            const endMins = parseInt(endH) * 60 + parseInt(endM);

            const card = document.createElement('div');
            card.className = `class-card ${sub ? 'is-sub' : ''}`;
            card.dataset.start = startMins;
            card.dataset.end = endMins;
            
            let html = `
                <div class="time-col">
                    <span class="lesson-num">${lesson.num} пара</span>
                    <span class="time-start ${isShortenedMode ? 'short-time' : ''}">${displayTime}</span>
                </div>
                <div class="info-col">
            `;

            if (sub) {
                html += `
                    <h3>${sub.subject}</h3>
                    <span class="sub-badge">${ICONS.warning} Заміна</span>
                    <span class="old-info">Було: ${lesson.subject}</span>
                `;
            } else {
                html += `
                    <h3>${lesson.subject}</h3>
                    ${lesson.room ? `<span class="room-badge">${lesson.room}</span>` : ''}
                `;
            }

            html += `<div class="time-info"></div></div>`;
            card.innerHTML = html;
            list.appendChild(card);
        });

        updateCardTimes();
    }

    function renderBells(data) {
        const list = document.getElementById('bellsList');
        list.innerHTML = '';
        data.forEach(bell => {
            const row = document.createElement('div');
            row.className = 'bell-row';
            row.innerHTML = `
                <div class="bell-num">${bell.num}</div>
                <div class="bell-time">${bell.time}</div>
                <div class="bell-break">${bell.break}</div>
            `;
            list.appendChild(row);
        });
    }

    function switchBells(type) {
        document.getElementById('btnRegular').classList.remove('active');
        document.getElementById('btnShort').classList.remove('active');
        if (type === 'regular') {
            document.getElementById('btnRegular').classList.add('active');
            renderBells(regularBells);
        } else {
            document.getElementById('btnShort').classList.add('active');
            renderBells(shortBells);
        }
    }

    function renderTeachers() {
        const list = document.getElementById('teachersList');
        if (!list) return;
        list.innerHTML = '';
        if (typeof teachersList === 'undefined') return;

        teachersList.forEach(teacher => {
            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.innerHTML = `
                <h3>${teacher.name}</h3>
                <div class="subjects">${teacher.subjects}</div>
                <div class="room">${ICONS.location} ${teacher.room}</div>
            `;
            list.appendChild(card);
        });
    }

    function renderBooks() {
        const list = document.getElementById('booksList');
        if (!list) return;
        list.innerHTML = '';

        if (typeof booksList === 'undefined' || booksList.length === 0) {
            list.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Книг поки немає.</p>';
            return;
        }

        booksList.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            
            const coverHTML = book.cover 
                ? `<img src="${book.cover}" alt="${book.title}">` 
                : `<span>${ICONS.book}</span>`;

            card.innerHTML = `
                <div class="book-cover">${coverHTML}</div>
                <div class="book-info">
                    <h3>${book.title}</h3>
                    <p>${book.author}</p>
                    <div class="book-actions">
                        <a href="${book.file}" target="_blank" class="btn-book btn-read">Читати</a>
                        <a href="${book.file}" download class="btn-book btn-download">Скачати</a>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    const navContainer = document.getElementById('liquidNav');
    const navBlob = document.getElementById('navBlob');
    const navItems = document.querySelectorAll('.nav-item');
    const itemWidth = navContainer.offsetWidth / navItems.length;

    let isDragging = false;
    let startX = 0;
    let currentBlobX = 0;
    let currentIndex = 0;

    function moveBlob(index) {
        currentIndex = index;
        const targetX = index * itemWidth;
        navBlob.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        navBlob.style.transform = `translateX(${targetX}px)`;
        navItems.forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
    }

    function switchTab(tabId, navElement, index) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        moveBlob(index);
    }

    function onDragStart(e) {
        isDragging = true;
        startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
        currentBlobX = currentIndex * itemWidth;
        navBlob.style.transition = 'none';
    }

    function onDragMove(e) {
        if (!isDragging) return;
        const x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
        const walk = (x - startX);
        let newX = currentBlobX + walk;
        if (newX < 0) newX = 0;
        if (newX > itemWidth * (navItems.length - 1)) newX = itemWidth * (navItems.length - 1);
        navBlob.style.transform = `translateX(${newX}px)`;
    }

    function onDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        const transformValue = window.getComputedStyle(navBlob).transform;
        let currentX = 0;
        if (transformValue !== 'none') {
            const matrix = new DOMMatrix(transformValue);
            currentX = matrix.m41;
        }
        const nearestIndex = Math.round(currentX / itemWidth);
        navBlob.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        moveBlob(nearestIndex);
        navItems[nearestIndex].click();
    }

    navContainer.addEventListener('mousedown', onDragStart);
    navContainer.addEventListener('mousemove', onDragMove);
    navContainer.addEventListener('mouseup', onDragEnd);
    navContainer.addEventListener('mouseleave', onDragEnd);
    navContainer.addEventListener('touchstart', onDragStart, { passive: true });
    navContainer.addEventListener('touchmove', onDragMove, { passive: true });
    navContainer.addEventListener('touchend', onDragEnd);
    
    window.addEventListener('resize', () => {
        const newItemWidth = navContainer.offsetWidth / navItems.length;
        moveBlob(currentIndex);
    });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => { console.log('SW OK'); })
        .catch(err => { console.log('SW Error', err); });
    });
  }
</script>
