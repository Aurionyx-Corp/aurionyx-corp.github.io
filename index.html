<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Aurionyx</title>
    <style>
        body {
            background: linear-gradient(135deg, #F5EDE0, #7FC4BC);
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 500px;
        }
        h1 { color: #5BA8A0; font-size: 42px; margin: 0; }
        p { color: #3D2E22; font-size: 18px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌊 Aurionyx</h1>
        <p>Crafting beautiful Android apps.</p>
    </div>
</body>
</html>
